[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbc-efa"
version = "0.1.0"
description = "Evidence-first step auditing on the DeepEyesV2 engineering base"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "huggingface-hub>=0.30", "requests>=2.31"]

[project.optional-dependencies]
model = ["torch==2.6.0", "transformers==4.51.3", "accelerate>=1.2,<1.8", "peft==0.15.2", "qwen-vl-utils==0.0.11", "lm-format-enforcer==0.10.11"]
data = ["pyarrow>=18"]
remote = ["paramiko>=3.5"]

[tool.setuptools.packages.find]
include = ["efa*"]
