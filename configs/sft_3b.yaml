# Adapted from DeepEyesV2 cold_start/examples/deepeyesv2/qwen2_5vl_full_sft_final_100k.yaml.
model_name_or_path: /data_cinema/zqc/VBC/models/Qwen2.5-VL-3B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
template: qwen2_vl
dataset: efa_steps,efa_regions,efa_reads
dataset_dir: /data_cinema/zqc/VBC/data/derived/sft_v0
cutoff_len: 2048
image_max_pixels: 200704
preprocessing_num_workers: 2
dataloader_num_workers: 0
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.00002
num_train_epochs: 1.0
max_steps: 100
gradient_checkpointing: true
bf16: true
quantization_bit: 4
quantization_method: bnb
double_quantization: true
flash_attn: sdpa
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 1
save_steps: 50
save_total_limit: 2
output_dir: /data_cinema/zqc/VBC/runs/sft_3b_v0
overwrite_output_dir: false
report_to: none
plot_loss: false
